<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24242a"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <!-- terminal window -->
  <rect x="200" y="160" width="1200" height="680" rx="16" fill="#101013" stroke="#e8e8ec" stroke-width="4"/>
  <rect x="200" y="160" width="1200" height="60" rx="16" fill="#2a2a30"/>
  <g fill="#9a9aa0"><circle cx="246" cy="190" r="10"/><circle cx="286" cy="190" r="10"/><circle cx="326" cy="190" r="10"/></g>
  <!-- command lines -->
  <g font-family="monospace" font-size="30" fill="#cfcfd4">
    <text x="250" y="300">&#62; lead-scout --icp b2b</text>
    <text x="250" y="352" fill="#6a6a72">scanning public web ...</text>
  </g>
  <!-- ranked result bars -->
  <g transform="translate(250 410)">
    <g fill="#1b1b1f" stroke="#5a5a62" stroke-width="2">
      <rect x="0" y="0" width="1100" height="56" rx="8"/>
      <rect x="0" y="78" width="1100" height="56" rx="8"/>
      <rect x="0" y="156" width="1100" height="56" rx="8"/>
      <rect x="0" y="234" width="1100" height="56" rx="8"/>
      <rect x="0" y="312" width="1100" height="56" rx="8"/>
    </g>
    <g fill="#f2f2f4">
      <rect x="0" y="0" width="980" height="56" rx="8" opacity="0.85"/>
      <rect x="0" y="78" width="760" height="56" rx="8" opacity="0.7"/>
      <rect x="0" y="156" width="610" height="56" rx="8" opacity="0.55"/>
      <rect x="0" y="234" width="470" height="56" rx="8" opacity="0.45"/>
      <rect x="0" y="312" width="330" height="56" rx="8" opacity="0.35"/>
    </g>
  </g>
  <!-- scanning beam -->
  <rect x="200" y="470" width="1200" height="6" fill="#ffffff" opacity="0.5"/>
